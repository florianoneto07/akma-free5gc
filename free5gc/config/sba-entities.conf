# Entities of the test PKI of the operator, read by free5gc/scripts/make-sba-certs.sh.
# The nfInstanceId of each NF, of the AAnF and of the AF is the one of its
# configuration: the certificate carries it as urn:uuid (TS 33.310 cl. 6.1.3c.3).
#
# country and domain go in the Subject (TS 33.310 table 6.1.3c.3-1): the country
# of MCC 208 and the Home Network Domain (TS 23.003 cl. 28.2). crl is the CRL
# distribution point: by address, valid in both addressing modes.
country FR
domain 5gc.mnc093.mcc208.3gppnetwork.org
crl http://192.168.16.130:8030/sba-ca.crl
#
# nf: client and server certificate (TS 33.310 table 6.1.3c.3-1)
# role  name  nfType  fqdn  address  port  nfInstanceId
nf nrf NRF nrf.5gc.mnc093.mcc208.3gppnetwork.org 127.0.0.10 8000 cdee1983-45ab-41a6-8f5b-6f832d5206e8
nf amf AMF amf1.amf.5gc.mnc093.mcc208.3gppnetwork.org 127.0.0.18 8000 63db01ad-fce2-4fde-8b78-3a62c60f3b8e
nf smf SMF smf.5gc.mnc093.mcc208.3gppnetwork.org 127.0.0.2 8000 5668c69e-db35-4954-9b51-8f7a477772a3
nf udr UDR udr.5gc.mnc093.mcc208.3gppnetwork.org 127.0.0.4 8000 9a7ed375-75f5-450d-a524-ed1d813fb164
nf pcf PCF pcf.5gc.mnc093.mcc208.3gppnetwork.org 127.0.0.7 8000 0e663921-9c8d-4714-8ee2-9e95b935c339
nf udm UDM udm.5gc.mnc093.mcc208.3gppnetwork.org 127.0.0.3 8000 878d3e9f-16c2-4ba8-8587-e7a238604028
nf nssf NSSF nssf.5gc.mnc093.mcc208.3gppnetwork.org 127.0.0.31 8000 230cf6b8-a555-44d2-951b-46c1f99c052c
nf ausf AUSF ausf.5gc.mnc093.mcc208.3gppnetwork.org 127.0.0.9 8000 50188f39-0103-42de-9c96-08d90549a2c0
nf chf CHF chf.5gc.mnc093.mcc208.3gppnetwork.org 127.0.0.113 8000 58591ae4-e433-4544-913f-8184ec62ac1a
nf nef NEF nef.5gc.mnc093.mcc208.3gppnetwork.org 192.168.16.130 8000 8e73ad07-906c-4952-93ac-cd32bbb076ed
nf bsf BSF bsf.5gc.mnc093.mcc208.3gppnetwork.org 127.0.0.15 8000 19d6c78c-73ed-4add-b121-78f3581c2c66
nf aanf AANF aanf.5gc.mnc093.mcc208.3gppnetwork.org 192.168.16.130 8010 b6f417f0-06fa-4c38-b291-33066f5a5fe7
#
# client: client certificate of an NF of type AF, or of a test tool. revoked,
# no-crldp and other-ca are the negative tests: revoked in the CRL, without the
# distribution point, signed by another CA.
# role  name  nfType  fqdn  -  -  nfInstanceId
client af1 AF af1.akma.example - - 2170454b-4cfa-406a-a77c-2137042b54b4
client af2 AF af2.akma.example - - e4b00d27-d8ed-473f-9f93-af78e87fc0ce
client seed-ausf AUSF seed-ausf.5gc.mnc093.mcc208.3gppnetwork.org - - 5a6d7127-edf7-4edc-960c-e4105ff023d8
client seed-af AF seed-af.5gc.mnc093.mcc208.3gppnetwork.org - - 0383f793-0b51-4fc6-996e-a9a8bafc4ce1
revoked revoked AF revoked.5gc.mnc093.mcc208.3gppnetwork.org - - 76f8f076-fd5b-4e0e-957c-807b5fadbdfa
no-crldp no-crldp AF no-crldp.5gc.mnc093.mcc208.3gppnetwork.org - - 68abf70b-8047-4f75-ae1b-7c96748a0eb6
other-ca other-ca AF other-ca.5gc.mnc093.mcc208.3gppnetwork.org - - 59a9afc9-6a78-41a8-a448-5e9d61e1eef2
#
# token: signs the access tokens of the NRF (TS 33.310 table 6.1.3c.3-2), with
# the nfInstanceId of the NRF
# role  name  nfType  fqdn  -  -  nfInstanceId
token nrf-token NRF - - - cdee1983-45ab-41a6-8f5b-6f832d5206e8
#
# ccf: internal server of the CCF, CAPIF-3/4 (TS 33.122 cl. 6.6; TS 33.310 cl. 6.1.3a)
# role  name  -  fqdn  address  port  -
ccf ccf-internal - ccf.5gc.mnc093.mcc208.3gppnetwork.org 127.0.0.1 8020 -
